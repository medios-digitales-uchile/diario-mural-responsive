name: Arnés - aprobación de responsables

# Revisa si el pull request toca carpetas que ya existían y pide la aprobación
# de su responsable. Arnés: https://github.com/medios-digitales-uchile/arnes
# (no editar esta copia: se reemplaza al reinstalar).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

concurrency:
  group: arnes-revision-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

jobs:
  revisar:
    name: Aprobación del responsable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revisar carpetas y aprobaciones
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/arnes/revisar.mjs

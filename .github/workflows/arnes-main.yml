name: Arnés - vigilante de main

# Carpeta nueva subida directo a main: permitido, queda registrado.
# Cambio directo a algo que ya existía: se revierte y se vuelve a publicar.
# Arnés: https://github.com/medios-digitales-uchile/arnes (no editar esta copia).
on:
  push:
    branches: [main]

concurrency:
  group: arnes-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: write

jobs:
  vigilar:
    name: Vigilante de main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revisar el push
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/arnes/vigilar.mjs
